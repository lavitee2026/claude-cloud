# 把 site/ 目录发布到 GitHub Pages。site/ 由本地 npm run build 生成并提交，CI 只负责发布。
# 首次使用前，在仓库 Settings → Pages 把 Source 设为 GitHub Actions。
name: 发布网站
on:
  push:
    branches: [claude/clever-wright-axh5rf]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
